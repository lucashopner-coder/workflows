name: Atualizar avaliações

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC (~06:00 em Brasília)
  workflow_dispatch: {}     # permite rodar manualmente pela aba "Actions" no GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar script de atualização
        run: python atualizar_avaliacoes.py

      - name: Publicar alterações (se houver)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add avaliacoes-lucas-hopner.html
          git diff --cached --quiet || git commit -m "Atualiza avaliações automaticamente"
          git push
